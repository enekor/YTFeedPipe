plugins {
    id 'com.android.application'
}

android {
    namespace 'es.eneko.ytfeedpipe'
    compileSdk 34

    defaultConfig {
        applicationId 'es.eneko.ytfeedpipe'
        minSdk 24          // Android 7.0
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // para instalar sin keystore propio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
